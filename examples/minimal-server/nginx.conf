server {
    listen 443 ssl;
    server_name _;

    # ssl_certificate     /etc/ssl/public.pem;
    # ssl_certificate_key /etc/ssl/private.pem;

    location /mcp {
        proxy_pass http://my-mcp:5000;

        proxy_set_header Host $host;

        # X-Real-IP is set from $remote_addr, which OVERWRITES whatever the
        # client sent. That is what makes it usable for a rate-limit key.
        proxy_set_header X-Real-IP $remote_addr;

        # X-Forwarded-For uses $proxy_add_x_forwarded_for, which APPENDS to the
        # client's value — so its left-most entry is caller-controlled. Fine for
        # logs, never for a security decision. The library ignores it by default.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
